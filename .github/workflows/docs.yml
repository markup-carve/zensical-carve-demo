name: Build and deploy the demo
on:
  push:
    branches:
      - master
      - main
  # A pull request builds the site and runs every check below, and stops there:
  # the deploy steps are guarded on a push. Without this the only thing that
  # ever ran the checks was the merge, so a change that broke a page was
  # discovered on the live site.
  pull_request:
# The default for every job. Writing to Pages and minting an OIDC token are
# granted to the deploy job alone: a pull request runs project code - build.sh,
# the plugin, whatever a dependency does at install time - and that code has no
# business holding a deployment credential.
permissions:
  contents: read

jobs:
  build:
    name: Build the site and check what it rendered
    permissions:
      contents: read
      # configure-pages reads the repository's Pages settings on a push. Read,
      # not write: this job runs project code, and the credential that can
      # publish belongs to the job that publishes.
      pages: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v6
        if: github.event_name == 'push'
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # zensical-carve is not on PyPI yet, so it installs from the repo. Swap
      # this for a plain `pip install zensical-carve` once it is released.
      - run: |
          pip install zensical
          pip install "git+https://github.com/markup-carve/zensical-carve@main"

      # `dot` draws the Graphviz diagram during the build - see
      # prerender-command in zensical.toml. A local binary rather than a Kroki
      # service, so the deploy needs no network for it and the bytes are the
      # same every time.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends graphviz

      # Renders every .crv page with every Carve extension enabled, then builds.
      # The extension list is read from the engine in build.sh, so a Carve
      # release that adds one turns it on here without a change to this file.
      - run: ./build.sh

      # A build that produces no pages still exits 0, and a missing extension
      # only shows as absent output. Both would deploy a quietly broken site.
      - name: Check the pages rendered, and the extensions ran
        run: |
          set -euo pipefail
          for page in index blocks/index diagrams/index reference/index; do
            test -f "site/${page}.html" || { echo "missing site/${page}.html"; exit 1; }
          done
          grep -q 'class="mermaid"' site/diagrams/index.html
          grep -q 'class="chart"' site/diagrams/index.html

          # Drawn during the build, so the page ships the SVG and no longer
          # ships the source for a client library to pick up.
          grep -q 'carve-diagram carve-diagram-graphviz' site/diagrams/index.html
          grep -q '<svg' site/diagrams/index.html
          ! grep -q '<pre class="graphviz"' site/diagrams/index.html

          # The symbol map is a render option; without it a shortcode renders as
          # its own source text, which reads as "emoji are unsupported". Counted
          # rather than merely present: the page writes each name in a code span
          # next to the rendered one, so "the string is on the page" proves
          # nothing here.
          test "$(grep -o 'class="twemoji"' site/index.html | wc -l)" -ge 3
          grep -q 'data-cite-key' site/reference/index.html
          grep -q '<caption' site/blocks/index.html
          grep -q 'class="spoiler"' site/index.html
          echo "every page built and the extension output is present"
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name == 'push'
        with:
          path: site

  # Split from the build so a pull request can run every check above without
  # touching the Pages environment, which only a push may write to.
  deploy:
    name: Deploy to GitHub Pages
    needs: [build]
    if: github.event_name == 'push'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
