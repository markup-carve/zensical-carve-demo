[project]
site_url = "https://markup-carve.github.io/zensical-carve-demo/"
site_name = "Carve showcase"
site_description = "Every Carve construct, rendered in Zensical"
# site_author = "Your name"

# copyright = "Copyright &copy; 2026 Your name"

repo_url = "https://github.com/markup-carve/zensical-carve-demo"
repo_name = "markup-carve/zensical-carve-demo"
# edit_uri = "edit/main/docs/"

nav = [
  { "The inline set" = "index.md" },
  { "Blocks" = "blocks.md" },
  { "Diagrams" = "diagrams.md" },
  { "Reference features" = "reference.md" },
  { "Markdown, for contrast" = "markdown.md" },
]

extra_css = ["stylesheets/carve.css"]
extra_javascript = [
  "https://cdn.jsdelivr.net/npm/chart.js@4",
  "https://cdn.jsdelivr.net/npm/vega@5",
  "https://cdn.jsdelivr.net/npm/vega-lite@5",
  "https://cdn.jsdelivr.net/npm/vega-embed@6",
  "javascripts/mathjax-config.js",
  "https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js",
  "javascripts/carve-hydrate.js",
]

[project.theme]
# variant = "classic"
# custom_dir = "overrides"
# favicon = "images/favicon.png"
language = "en"
features = [
  "announce.dismiss",
  # "content.action.edit",
  # "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  # "header.autohide",
  # "navigation.expand",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  # "navigation.instant.progress",
  "navigation.path",
  # "navigation.prune",
  "navigation.sections",
  # "navigation.tabs",
  # "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  # "toc.follow",
  # "toc.integrate",
]

# logo = "assets/logo.png"

# [project.theme.icon]
# logo = "lucide/smile"

# [project.theme.font]
# text = "Inter"
# code = "Jetbrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

# [[project.extra.social]]
# icon = "fontawesome/brands/github"
# link = "https://github.com/user/repo"

# [[project.extra.social]]
# icon = "fontawesome/brands/mastodon"
# link = "https://fosstodon.org/@user"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
# pymdownx.snippets.base_path = "includes"
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
  { name = "carve", class = "carve", format = "zensical_carve.fence" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}

# Everything zensical-carve needs, in the file the rest of the site is
# configured in. Zensical ignores a table it does not know.
#
# The EXTENSION LIST is deliberately not here: build.sh reads it from the
# engine, so a Carve release that adds one turns it on in this demo without an
# edit. A flag beats this table, which is what makes that work.
[tool.zensical-carve]
# `:smile:` parses in core, but the map from a name to a glyph is a render
# option - without one the shortcode renders as its own source text. `twemoji`
# emits the same <img class="twemoji"> element Zensical emits for a Markdown
# page, from Zensical's own emoji index, so the two page types match.
emoji = "twemoji"

# Draw Graphviz at build time instead of shipping @hpcc-js/wasm to every reader
# and swapping the picture in after the page loads. The other diagram languages
# on the Diagrams page stay client-side on purpose, so the page shows both.
prerender = ["graphviz"]

# Through the local `dot` binary rather than a Kroki service: the deploy then
# needs no network for it, produces the same bytes every time, and the demo
# shows the backend that sends nothing anywhere.
[tool.zensical-carve.prerender-command]
graphviz = "dot -Tsvg {input}"
